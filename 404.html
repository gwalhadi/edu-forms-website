<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>الصفحة غير موجودة</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f4fa; color: #241a46; font-family: system-ui, 'Segoe UI', Tahoma, sans-serif; }
    .card { background: #fff; border-radius: 14px; padding: 32px 28px; max-width: 420px; text-align: center; box-shadow: 0 6px 28px rgba(33, 26, 53, .12); }
    a { display: inline-block; margin-top: 12px; background: #5a3d9f; color: #fff; padding: 10px 20px; border-radius: 10px; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1 style="margin:0 0 8px;font-size:22px">الصفحة غير موجودة</h1>
    <p style="color:#6b6480">الرابط الذي فتحتِه غير صحيح أو لم يعد متاحًا.</p>
    <a id="home" href="/">العودة إلى النماذج</a>
  </div>
  <script>
    // GitHub Pages project sites live under /<repository>/ — send old links (/f/<slug>) to the new form page.
    (function () {
      var parts = location.pathname.split('/').filter(Boolean);
      var base = location.hostname.endsWith('github.io') && parts.length ? '/' + parts[0] + '/' : '/';
      document.getElementById('home').href = base;
      var i = parts.lastIndexOf('f');
      if (i >= 0 && parts[i + 1] && /^[a-z0-9-]+$/.test(parts[i + 1])) {
        var root = '/' + parts.slice(0, i).join('/') + (i ? '/' : '');
        location.replace(root + 'form.html?f=' + parts[i + 1]);
      }
    })();
  </script>
</body>
</html>
